<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | Glow Haven</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  

<nav class="navbar">
    <div class="container">
        <a href="index.html"
class="nav-logo">Glow <span>Haven</span></a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="tips.html">Tips</a>
            <a href="booking.html">Booking</a>
            <a href="contact.html">Contact</a>
        </div>  
    </div>
</nav>

  <div class="page-hero">
    <div class="container">
      <h1>Contact Us</h1>
      <p>We would love to hear from you — get in touch with our team</p>
    </div>
  </div>

  <section class="section-pad">
    <div class="container">
      <div class="contact-layout">

        <div class="contact-form-container">
          <h2 class="section-title">Send Us a <span>Message</span></h2>
          <form id="contactForm">
            <div class="form-grid">
              <div class="form-group">
                <label for="cName">Your Name <span>*</span></label>
                <input type="text" id="cName" required placeholder="e.g. Kefilwe Dube" />
              </div>
              <div class="form-group">
                <label for="cEmail">Email Address <span>*</span></label>
                <input type="email" id="cEmail" required placeholder="you@example.com" />
              </div>
              <div class="form-group full">
                <label for="cSubject">Subject <span>*</span></label>
                <input type="text" id="cSubject" required placeholder="Enquiry about facials" />
              </div>
              <div class="form-group full">
                <label for="cMessage">Your Message <span>*</span></label>
                <textarea id="cMessage" required placeholder="Write here..." style="min-height: 120px;"></textarea>
              </div>
            </div>
            <button type="submit" class="btn-pink">Send Message</button>
          </form>
        </div>

        <div class="contact-info-card">
          <h3>Get in Touch</h3>
          <div class="contact-item">
            <span class="icon">📍</span>
            <div>
              <h4>Location</h4>
              <p>Plot 1234, Main Mall, Gaborone</p>
            </div>
          </div>
          <div class="contact-item">
            <span class="icon">📞</span>
            <div>
              <h4>Phone</h4>
              <p>+267 71 234 567</p>
            </div>
          </div>
          <div class="contact-item">
            <span class="icon">✉️</span>
            <div>
              <h4>Email</h4>
              <p>hello@glowhaven.bw</p>
            </div>
          </div>
        </div>

      </div>
    </div>
  </section>

</body>
</html>
